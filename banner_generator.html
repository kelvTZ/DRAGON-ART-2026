<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Gráfico de Destaque - Dragon Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <!-- Adicionando biblioteca para baixar a imagem automaticamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        
        .banner-container {
            width: 1024px;
            height: 500px;
            background-image: url('video_assets/bg_pixelart_1.png');
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 0; /* Removido arredondamento para a loja */
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(15,15,25,0.95) 0%, rgba(15,15,25,0.7) 45%, rgba(15,15,25,0.1) 100%);
            z-index: 1;
        }

        .content-left {
            position: relative;
            z-index: 2;
            width: 45%;
            padding-left: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            width: 320px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .title {
            font-size: 38px;
            font-weight: 900;
            line-height: 1.2;
            margin: 0 0 15px 0;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 20px;
            color: #d1d5db;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .badges {
            display: flex;
            gap: 15px;
        }

        .badge-img {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .content-right {
            position: relative;
            z-index: 2;
            width: 55%;
            display: flex;
            justify-content: center;
            perspective: 1000px;
        }

        .app-screenshot {
            width: 480px;
            height: 280px;
            background-color: #111;
            border-radius: 12px;
            border: 4px solid #333;
            box-shadow: -25px 25px 50px rgba(0,0,0,0.7), inset 0 0 10px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            transform: rotateY(-15deg) rotateX(5deg) scale(1.05);
        }
        
        .app-screenshot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #1a1a1a;
        }

        .controls {
            margin-bottom: 20px;
        }

        .btn-download {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        
        .btn-download:active {
            transform: translateY(1px);
        }

    </style>
</head>
<body>
    <div class="controls">
        <button class="btn-download" onclick="baixarImagem()" id="btnBaixar">
            ⬇️ Baixar Imagem Oficial (1024x500)
        </button>
    </div>

    <!-- O BANNER -->
    <div class="banner-container" id="banner">
        <div class="overlay"></div>
        
        <div class="content-left">
            <img src="video_assets/logo.png" alt="Dragon Art Logo" class="logo" onerror="this.src='https://placehold.co/320x100?text=Dragon+Art'">
            <h1 class="title">O Seu Estúdio de Pixel Art de Bolso</h1>
            <p class="subtitle">Crie, anime e compartilhe obras de arte em alta resolução.</p>
            <div class="badges">
                <img src="video_assets/pro_5.png" alt="Badge" class="badge-img" onerror="this.style.display='none'">
                <img src="video_assets/star.png" alt="Badge" class="badge-img" onerror="this.style.display='none'">
                <img src="video_assets/fire.png" alt="Badge" class="badge-img" onerror="this.style.display='none'">
            </div>
        </div>

        <div class="content-right">
            <div class="app-screenshot">
                <img src="video_assets/AMBIENTE_Captura_de_tela_2026-05-10_191934.png" alt="App Screenshot" onerror="this.src='https://placehold.co/480x280?text=Screenshot'">
            </div>
        </div>
    </div>

    <script>
        function baixarImagem() {
            const btn = document.getElementById('btnBaixar');
            btn.innerHTML = '⏳ Gerando imagem...';
            btn.style.opacity = '0.7';
            
            // html2canvas converte a div em uma imagem PNG real
            html2canvas(document.getElementById('banner'), {
                width: 1024,
                height: 500,
                scale: 1, // Mantém exatamente 1024x500
                useCORS: true,
                backgroundColor: '#222'
            }).then(canvas => {
                // Cria o link de download
                const link = document.createElement('a');
                link.download = 'grafico_destaque_dragonart.png';
                link.href = canvas.toDataURL('image/png');
                link.click(); // Força o download
                
                btn.innerHTML = '✅ Imagem Baixada!';
                btn.style.opacity = '1';
                
                setTimeout(() => {
                    btn.innerHTML = '⬇️ Baixar Imagem Oficial (1024x500)';
                }, 3000);
            });
        }
    </script>
</body>
</html>
